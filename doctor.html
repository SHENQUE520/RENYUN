<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>韧云智护 · 医生工作台</title>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.doctor-body{
    flex:1;display:grid;grid-template-columns:260px 1fr;
    gap:22px;padding:22px 30px 28px;overflow:hidden;min-height:0;
}
/* Left patient list */
.plist-card{padding:20px 0 16px 18px;display:flex;flex-direction:column;overflow:hidden;}
.plist-card .card-title{padding-right:18px;margin-bottom:12px;}
.plist-scroll{overflow-y:auto;padding-right:14px;flex:1;}
.pitem{
    padding:11px 14px;border-radius:12px;cursor:pointer;transition:0.18s;
    margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;
    border:1.5px solid transparent;
}
.pitem:hover{background:#f1f5f9;}
.pitem.active{background:#dbeafe;border-color:#2563eb;}
.pitem .pname{font-weight:500;font-size:14px;color:#0a2540;}
.pitem .pmeta{font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:6px;}
/* Right detail */
.detail-panel{display:flex;flex-direction:column;overflow:auto;min-height:0;}
.detail-panel .dpanel-inner{
    background:#fff;border-radius:20px;border:1px solid #e9f0fa;
    box-shadow:0 4px 16px rgba(0,0,0,0.03);padding:24px 26px 22px;
    display:flex;flex-direction:column;flex:1;overflow:auto;min-height:0;
}
.detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-shrink:0;}
.detail-head .dname{font-size:19px;font-weight:600;color:#0a2540;}
.detail-head .dname small{font-size:13px;font-weight:400;color:#64748b;margin-left:8px;}
.doctor-chart-wrap{height:110px;margin:4px 0 16px;flex-shrink:0;}
.record-section{font-weight:600;font-size:14px;color:#0a2540;margin-bottom:9px;flex-shrink:0;}
.record-wrap{flex:1;overflow:auto;min-height:80px;border-radius:12px;border:1px solid #eef2f6;margin-bottom:16px;}
.assign-bar{
    flex-shrink:0;background:#f8fbff;border-radius:14px;padding:16px 18px;
    border:1px solid #e9f0fa;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.assign-bar .alabel{font-weight:500;font-size:14px;color:#0a2540;white-space:nowrap;}
.assign-bar select,.assign-bar input[type=number]{
    padding:8px 12px;border-radius:9px;border:1.5px solid #e2e8f0;
    font-size:14px;background:#fff;outline:none;transition:0.2s;font-family:inherit;
}
.assign-bar select:focus,.assign-bar input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
.assign-bar .task-btn-link{
    padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:9px;
    font-size:13px;font-weight:500;cursor:pointer;transition:0.2s;white-space:nowrap;
    text-decoration:none;display:inline-flex;align-items:center;gap:5px;
}
.assign-bar .task-btn-link:hover{background:#1d4ed8;box-shadow:0 4px 14px rgba(37,99,235,0.28);}
/* Calendar pill in patient list */
.checkin-pill{
    font-size:11px;background:#dcfce7;color:#16a34a;padding:2px 8px;
    border-radius:20px;font-weight:500;
}
.checkin-pill.warn{background:#fee2e2;color:#dc2626;}
@media(max-width:1050px){.doctor-body{grid-template-columns:1fr;}}
@media(max-width:640px){.doctor-body{padding:14px;gap:14px;}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<header class="app-header">
    <div class="left">
        <a class="brand" href="doctor.html">🦿 韧云智护<small>· 医生工作台</small></a>
    </div>
    <div class="right">
        <a class="user-info" href="profile.html">
            <div class="avatar" id="headerAvatar">李</div>
            <div class="detail">
                <div class="name" id="headerName">李医生</div>
                <div class="role-tag">👨‍⚕️ 主治医师</div>
            </div>
        </a>
        <span class="doctor-ref" id="headerRef"></span>
        <a class="nav-btn primary" href="doctor-task.html">📋 发布任务</a>
        <button class="nav-btn" onclick="logout()">退出</button>
    </div>
</header>

<div class="doctor-body">
    <!-- Patient list -->
    <div class="card plist-card">
        <div class="card-title">
            <span>👥 患者列表</span>
            <span class="sub" id="pTotal">5 位</span>
        </div>
        <div class="plist-scroll" id="plistWrap"></div>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel">
        <div class="dpanel-inner">
            <div class="detail-head">
                <div class="dname" id="dPatientName">张明 <small>康复中</small></div>
                <span class="badge badge-green" id="dStatusTag">标准</span>
            </div>

            <div class="stats-row" id="statsRow">
                <div class="stat-item">
                    <div class="icon-bg">📋</div>
                    <div><div class="num" id="statTotal">5</div><div class="lbl">管理患者</div></div>
                </div>
                <div class="stat-item">
                    <div class="icon-bg">🔥</div>
                    <div><div class="num" id="statActive">0</div><div class="lbl">今日活跃</div></div>
                </div>
                <div class="stat-item">
                    <div class="icon-bg">⚠️</div>
                    <div><div class="num" id="statWarn">0</div><div class="lbl">预警提醒</div></div>
                </div>
            </div>

            <div class="doctor-chart-wrap">
                <canvas id="doctorChart"></canvas>
            </div>

            <div class="record-section">📊 动作执行记录</div>
            <div class="record-wrap">
                <table class="record-table" id="recordTable">
                    <thead><tr>
                        <th>时间</th><th>动作类型</th><th>最大Pitch角</th><th>异常次数</th><th>状态</th>
                    </tr></thead>
                    <tbody id="recordBody"></tbody>
                </table>
            </div>

            <div class="assign-bar">
                <span class="alabel">📤 快速发放任务</span>
                <select id="quickPatient"></select>
                <select id="quickTask">
                    <option>直腿抬高</option><option>靠墙静蹲</option>
                    <option>单腿支撑</option><option>蚌式开合</option>
                </select>
                <input type="number" id="quickCount" value="15" min="1" max="200" style="width:68px;"/>
                <span style="font-size:13px;color:#64748b;">次</span>
                <button class="task-btn-link" id="quickAssignBtn">发放</button>
                <a class="task-btn-link" href="doctor-task.html">自定义任务 →</a>
            </div>
        </div>
    </div>
</div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script>
if (!requireAuth('doctor')) throw new Error('unauth');
initHeader('doctor');

let docChart = null;

function renderPatientList() {
    const wrap = document.getElementById('plistWrap');
    const today = getTodayStr();
    wrap.innerHTML = DB.patients.map(p => {
        const active = p.id === DB.currentPatientId ? 'active' : '';
        const checkedToday = p.history.some(h => h.date === today && h.done);
        const warnCount = p.records.filter(r => r.abnormal > 0).length;
        const pill = warnCount > 0
            ? `<span class="checkin-pill warn">⚠️ ${warnCount}</span>`
            : checkedToday
                ? `<span class="checkin-pill">✅ 已打卡</span>`
                : `<span class="checkin-pill warn">未打卡</span>`;
        return `<div class="pitem ${active}" onclick="selectPatient('${p.id}')">
            <div>
                <div class="pname">${p.name}</div>
                <div class="pmeta">${p.gender} · ${p.age}岁</div>
            </div>
            ${pill}
        </div>`;
    }).join('');
    document.getElementById('pTotal').textContent = DB.patients.length + ' 位';
}

function selectPatient(id) {
    DB.currentPatientId = id;
    saveDB();
    renderPatientList();
    renderDetail(id);
}
window.selectPatient = selectPatient;

function renderDetail(id) {
    const p = DB.patients.find(x => x.id === id);
    if (!p) return;
    document.getElementById('dPatientName').innerHTML = p.name + ' <small>' + p.status + '</small>';
    document.getElementById('dStatusTag').textContent = p.status;

    // Chart
    const data = p.monitorData && p.monitorData.length ? p.monitorData : Array.from({length:20},()=>25+Math.random()*30);
    const ctx = document.getElementById('doctorChart').getContext('2d');
    if (docChart) docChart.destroy();
    docChart = new Chart(ctx, {
        type:'line',
        data:{
            labels: data.map((_,i)=>i+''),
            datasets:[{
                label:'Pitch 角度 (°)',data,
                borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,0.06)',
                borderWidth:2,pointRadius:0,fill:true,tension:0.35,
            }]
        },
        options:{
            responsive:true,maintainAspectRatio:false,
            plugins:{legend:{labels:{color:'#475569',font:{size:11},boxWidth:10,padding:8}},
                tooltip:{backgroundColor:'#0a2540',cornerRadius:8,padding:8}},
            scales:{
                x:{grid:{color:'rgba(0,0,0,0.03)'},ticks:{color:'#94a3b8',font:{size:9}}},
                y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#94a3b8',font:{size:9}},min:0,max:80}
            },
            interaction:{intersect:false,mode:'index'}
        }
    });

    // Records
    const tbody = document.getElementById('recordBody');
    if (!p.records.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:24px 0;">暂无动作记录</td></tr>';
    } else {
        tbody.innerHTML = p.records.map(r =>
            `<tr><td>${r.time}</td><td>${r.action}</td><td>${r.pitch}°</td>
             <td>${r.abnormal}</td>
             <td><span class="badge ${getStatusClass(r.status)}">${r.status}</span></td></tr>`
        ).join('');
    }
    updateStats();
    renderQuickSelect();
}

function updateStats() {
    const today = getTodayStr();
    document.getElementById('statTotal').textContent = DB.patients.length;
    document.getElementById('statActive').textContent = DB.patients.filter(p=>p.history.some(h=>h.date===today&&h.done)).length;
    document.getElementById('statWarn').textContent = DB.patients.filter(p=>p.records.some(r=>r.abnormal>0)).length;
}

function renderQuickSelect() {
    const sel = document.getElementById('quickPatient');
    sel.innerHTML = DB.patients.map(p =>
        `<option value="${p.id}" ${p.id===DB.currentPatientId?'selected':''}>${p.name}</option>`
    ).join('');
}

document.getElementById('quickAssignBtn').onclick = function() {
    const pid = document.getElementById('quickPatient').value;
    const taskName = document.getElementById('quickTask').value;
    const count = parseInt(document.getElementById('quickCount').value) || 15;
    const p = DB.patients.find(x => x.id === pid);
    if (!p) return;
    const existing = p.tasks.find(t => t.name === taskName);
    if (existing) { existing.count = count; existing.done = false; }
    else p.tasks.push({name:taskName, count, unit:'次', keyPoints:'', details:'', done:false});
    const now = new Date();
    const ts = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
    p.records.unshift({time:ts,action:taskName,pitch:Math.round(30+Math.random()*25),abnormal:0,status:'标准'});
    if (p.records.length > 20) p.records.pop();
    saveDB();
    renderDetail(DB.currentPatientId);
    renderPatientList();
    showToast(`已向 ${p.name} 发放：${taskName} × ${count}`, 'success');
};

renderPatientList();
renderDetail(DB.currentPatientId);
</script>
<script src="js/chat.js"></script>
<script>
initChat('doctor');
</script>
</body>
</html>
