<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>韧云智护 · 发布任务</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:#f5f9ff;}
.task-body{
    flex:1;display:grid;grid-template-columns:1fr 400px;
    gap:22px;padding:24px 30px 36px;overflow:auto;
}
/* Left: preset + custom builder */
.builder-col{display:flex;flex-direction:column;gap:20px;}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.preset-card{
    background:#f8fbff;border:1.5px solid #e2e8f0;border-radius:14px;
    padding:16px 18px;cursor:pointer;transition:0.2s;
}
.preset-card:hover{border-color:#2563eb;background:#eff6ff;}
.preset-card.selected{border-color:#2563eb;background:#dbeafe;}
.preset-card .ptitle{font-size:14px;font-weight:600;color:#0a2540;margin-bottom:4px;}
.preset-card .pdesc{font-size:12px;color:#64748b;line-height:1.5;}
.custom-builder{background:#fff;border-radius:20px;border:1px solid #e9f0fa;
    box-shadow:0 4px 16px rgba(0,0,0,0.03);padding:24px 26px;}
.builder-title{font-size:15px;font-weight:600;color:#0a2540;margin-bottom:18px;
    display:flex;align-items:center;gap:8px;}
.inline-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.add-action-btn{
    width:100%;padding:11px;background:#f0f7ff;color:#2563eb;border:1.5px dashed #93c5fd;
    border-radius:11px;font-size:14px;font-weight:500;cursor:pointer;transition:0.2s;margin-top:4px;
}
.add-action-btn:hover{background:#dbeafe;border-color:#2563eb;}
/* Right: patient + task list */
.assign-col{display:flex;flex-direction:column;gap:18px;}
.assign-panel{background:#fff;border-radius:20px;border:1px solid #e9f0fa;
    box-shadow:0 4px 16px rgba(0,0,0,0.03);padding:24px 24px 20px;}
.task-preview-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
.task-preview-item{
    background:#f8fbff;border-radius:12px;padding:13px 16px;
    border:1px solid #e9f0fa;display:flex;align-items:flex-start;
    justify-content:space-between;gap:10px;
}
.task-preview-item .tinfo .tname{font-size:14px;font-weight:600;color:#0a2540;}
.task-preview-item .tinfo .tmeta{font-size:12px;color:#64748b;margin-top:3px;}
.task-preview-item .tinfo .tpoints{font-size:12px;color:#2563eb;margin-top:3px;}
.task-preview-item .tinfo .tdetails{font-size:11px;color:#94a3b8;margin-top:2px;}
.remove-btn{background:none;border:none;font-size:16px;cursor:pointer;color:#94a3b8;
    flex-shrink:0;padding:2px 4px;border-radius:6px;transition:0.15s;line-height:1;}
.remove-btn:hover{color:#dc2626;background:#fee2e2;}
.empty-tasks{color:#94a3b8;font-size:13px;text-align:center;padding:24px 0;}
.submit-bar{margin-top:6px;}
@media(max-width:1000px){.task-body{grid-template-columns:1fr;}}
@media(max-width:640px){.task-body{padding:14px;gap:14px;}.preset-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<header class="app-header">
    <div class="left">
        <a class="brand" href="doctor.html">🦿 韧云智护<small>· 发布任务</small></a>
    </div>
    <div class="right">
        <a class="user-info" href="profile.html">
            <div class="avatar" id="headerAvatar">李</div>
            <div class="detail">
                <div class="name" id="headerName">李医生</div>
                <div class="role-tag">👨‍⚕️ 主治医师</div>
            </div>
        </a>
        <a class="nav-btn" href="doctor.html">← 返回工作台</a>
        <button class="nav-btn" onclick="logout()">退出</button>
    </div>
</header>

<div class="task-body">
    <!-- Left: builder -->
    <div class="builder-col">
        <!-- Preset actions -->
        <div class="card" style="padding:22px 24px;">
            <div class="card-title">📌 预设动作<span class="sub">点击添加到任务单</span></div>
            <div class="preset-grid" id="presetGrid"></div>
        </div>

        <!-- Custom action builder -->
        <div class="custom-builder">
            <div class="builder-title">✏️ 自定义动作</div>
            <div class="inline-row">
                <div class="field">
                    <label>动作名称</label>
                    <input type="text" id="cName" placeholder="如：踝泵运动"/>
                </div>
                <div class="inline-row" style="gap:10px;">
                    <div class="field">
                        <label>数量</label>
                        <input type="number" id="cCount" value="10" min="1" max="999"/>
                    </div>
                    <div class="field">
                        <label>单位</label>
                        <select id="cUnit">
                            <option value="次">次</option>
                            <option value="秒">秒</option>
                            <option value="分钟">分钟</option>
                            <option value="组">组</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="field">
                <label>动作要点</label>
                <input type="text" id="cKeyPoints" placeholder="关键注意事项，简明扼要"/>
            </div>
            <div class="field">
                <label>动作细节说明</label>
                <textarea id="cDetails" placeholder="详细描述动作步骤、姿势要求、注意事项等…" style="min-height:90px;"></textarea>
            </div>
            <button class="add-action-btn" id="addCustomBtn">＋ 添加到任务单</button>
        </div>
    </div>

    <!-- Right: patient selector + task list -->
    <div class="assign-col">
        <div class="assign-panel">
            <div class="card-title">👤 选择患者</div>
            <div class="field" style="margin-bottom:0;">
                <select id="targetPatient" style="font-size:15px;padding:12px 14px;"></select>
            </div>
        </div>

        <div class="assign-panel" style="flex:1;display:flex;flex-direction:column;">
            <div class="card-title">
                <span>📋 当前任务单</span>
                <span class="sub" id="taskCount">0 项</span>
            </div>
            <div class="task-preview-list" id="taskPreviewList">
                <div class="empty-tasks">从左侧添加动作到任务单</div>
            </div>
            <div class="submit-bar">
                <button class="btn btn-primary btn-full" id="submitTasksBtn" style="margin-top:14px;">
                    📨 发布任务单
                </button>
            </div>
        </div>
    </div>
</div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script>
if (!requireAuth('doctor')) throw new Error('unauth');
initHeader('doctor');

const PRESETS = [
    { name:'直腿抬高', count:10, unit:'次', keyPoints:'保持膝关节完全伸直', details:'仰卧位，下肢伸直抬高约45°，保持5秒后缓慢放下，全程不弯曲膝关节。' },
    { name:'靠墙静蹲', count:30, unit:'秒', keyPoints:'膝关节不超过脚尖', details:'背靠光滑墙面，双脚与肩同宽，屈膝约90°，保持腰背贴墙，膝关节不内扣。' },
    { name:'单腿支撑', count:15, unit:'次', keyPoints:'保持骨盆水平', details:'单脚站立，支撑腿微屈，对侧髋关节保持水平，控制5～10秒后换腿。' },
    { name:'蚌式开合', count:20, unit:'次', keyPoints:'保持骨盆稳定不旋转', details:'侧卧，双腿屈曲叠放，保持双脚并拢，上侧膝盖向上打开至最大幅度，缓慢回落。' },
    { name:'踝泵运动', count:20, unit:'次', keyPoints:'足背充分屈伸', details:'仰卧或坐位，踝关节最大幅度背伸（勾脚）及跖屈（绷脚），各保持3秒。' },
    { name:'股四头肌等长收缩', count:15, unit:'次', keyPoints:'保持股四头肌紧绷', details:'仰卧，腿伸直，主动收紧大腿前方肌肉，感觉膝关节压向床面，保持5秒。' },
];

// Draft task list for this session
let draftTasks = [];

function renderPresets() {
    document.getElementById('presetGrid').innerHTML = PRESETS.map((p, i) =>
        `<div class="preset-card" onclick="addPreset(${i})">
            <div class="ptitle">${p.name}</div>
            <div class="pdesc">${p.count}${p.unit} · ${p.keyPoints}</div>
        </div>`
    ).join('');
}
window.addPreset = function(i) {
    const p = PRESETS[i];
    addToList({ name:p.name, count:p.count, unit:p.unit, keyPoints:p.keyPoints, details:p.details });
};

function addToList(task) {
    const existing = draftTasks.find(t => t.name === task.name);
    if (existing) { existing.count = task.count; showToast(`已更新：${task.name}`, 'info'); }
    else { draftTasks.push({ ...task, done:false }); showToast(`已添加：${task.name}`, 'success'); }
    renderDraftList();
}

function renderDraftList() {
    document.getElementById('taskCount').textContent = draftTasks.length + ' 项';
    const list = document.getElementById('taskPreviewList');
    if (!draftTasks.length) {
        list.innerHTML = '<div class="empty-tasks">从左侧添加动作到任务单</div>';
        return;
    }
    list.innerHTML = draftTasks.map((t, i) =>
        `<div class="task-preview-item">
            <div class="tinfo">
                <div class="tname">${t.name} <span style="font-weight:400;color:#64748b;font-size:12px;">× ${t.count}${t.unit}</span></div>
                ${t.keyPoints ? `<div class="tpoints">要点：${t.keyPoints}</div>` : ''}
                ${t.details ? `<div class="tdetails">${t.details}</div>` : ''}
            </div>
            <button class="remove-btn" onclick="removeTask(${i})" title="移除">×</button>
        </div>`
    ).join('');
}
window.removeTask = function(i) {
    draftTasks.splice(i, 1);
    renderDraftList();
};

document.getElementById('addCustomBtn').onclick = function() {
    const name = document.getElementById('cName').value.trim();
    if (!name) { showToast('请填写动作名称', 'error'); return; }
    const count = parseInt(document.getElementById('cCount').value) || 10;
    const unit = document.getElementById('cUnit').value;
    const keyPoints = document.getElementById('cKeyPoints').value.trim();
    const details = document.getElementById('cDetails').value.trim();
    addToList({ name, count, unit, keyPoints, details });
    document.getElementById('cName').value = '';
    document.getElementById('cKeyPoints').value = '';
    document.getElementById('cDetails').value = '';
    document.getElementById('cCount').value = 10;
};

function renderPatientSelect() {
    document.getElementById('targetPatient').innerHTML = DB.patients.map(p =>
        `<option value="${p.id}" ${p.id===DB.currentPatientId?'selected':''}>${p.name} · ${p.gender} ${p.age}岁</option>`
    ).join('');
}

document.getElementById('submitTasksBtn').onclick = function() {
    if (!draftTasks.length) { showToast('请先添加至少一个动作', 'error'); return; }
    const pid = document.getElementById('targetPatient').value;
    const p = DB.patients.find(x => x.id === pid);
    if (!p) return;

    draftTasks.forEach(dt => {
        const existing = p.tasks.find(t => t.name === dt.name);
        if (existing) { Object.assign(existing, dt); }
        else { p.tasks.push({ ...dt }); }
    });

    const now = new Date();
    const ts = [now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
    draftTasks.forEach(dt => {
        p.records.unshift({ time:ts, action:dt.name, pitch:Math.round(30+Math.random()*25), abnormal:0, status:'标准' });
    });
    if (p.records.length > 30) p.records.length = 30;

    saveDB();
    showToast(`已向 ${p.name} 发布 ${draftTasks.length} 项任务`, 'success');
    draftTasks = [];
    renderDraftList();
};

renderPresets();
renderPatientSelect();
renderDraftList();
</script>
</body>
</html>
