<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>韧云智护 · 个人信息</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:#f5f9ff;}
.profile-body{flex:1;display:flex;justify-content:center;padding:32px 24px 48px;overflow:auto;}
.profile-wrap{width:100%;max-width:680px;}
.profile-hero{
    background:linear-gradient(135deg,#1a4b8c 0%,#2563eb 100%);
    border-radius:22px;padding:32px 36px;color:#fff;
    display:flex;align-items:center;gap:24px;margin-bottom:24px;
    position:relative;overflow:hidden;
}
.profile-hero::after{
    content:'';position:absolute;top:-60px;right:-40px;
    width:220px;height:220px;background:rgba(255,255,255,0.06);border-radius:50%;
}
.profile-avatar-lg{
    width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.22);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:700;flex-shrink:0;border:2px solid rgba(255,255,255,0.3);
    z-index:1;
}
.profile-hero-info{z-index:1;}
.profile-hero-info .pname{font-size:22px;font-weight:700;letter-spacing:0.5px;}
.profile-hero-info .prole{
    font-size:13px;opacity:0.8;margin-top:4px;
    background:rgba(255,255,255,0.15);display:inline-block;
    padding:2px 14px;border-radius:20px;
}
.section-card{background:#fff;border-radius:20px;border:1px solid #e9f0fa;
    box-shadow:0 4px 16px rgba(0,0,0,0.03);padding:28px 32px;margin-bottom:20px;}
.section-title{font-size:15px;font-weight:600;color:#0a2540;margin-bottom:20px;
    padding-bottom:12px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
.form-grid .field.full{grid-column:1/-1;}
.readonly-field{
    width:100%;padding:11px 14px;border:1.5px solid #f1f5f9;border-radius:10px;
    font-size:14px;background:#f8fbff;color:#94a3b8;font-family:inherit;
}
.action-row{display:flex;gap:12px;justify-content:flex-end;margin-top:4px;}
.back-btn{
    display:inline-flex;align-items:center;gap:6px;padding:7px 16px;
    border:1px solid #e2e8f0;border-radius:30px;font-size:13px;color:#64748b;
    text-decoration:none;background:transparent;cursor:pointer;transition:0.2s;
}
.back-btn:hover{background:#f1f5f9;color:#1e293b;}
@media(max-width:600px){
    .form-grid{grid-template-columns:1fr;}
    .form-grid .field.full{grid-column:1;}
    .profile-hero{padding:24px 20px;}
    .section-card{padding:22px 18px;}
}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<header class="app-header">
    <div class="left">
        <a class="brand" id="backBrand" href="#">🦿 韧云智护</a>
    </div>
    <div class="right">
        <a class="back-btn" id="backBtn" href="#">← 返回</a>
        <button class="nav-btn" onclick="logout()">退出</button>
    </div>
</header>

<div class="profile-body">
    <div class="profile-wrap fade-in">
        <div class="profile-hero">
            <div class="profile-avatar-lg" id="heroAvatar">张</div>
            <div class="profile-hero-info">
                <div class="pname" id="heroName">张明</div>
                <div class="prole" id="heroRole">🧑 使用者</div>
            </div>
        </div>

        <!-- Basic Info -->
        <div class="section-card">
            <div class="section-title">👤 基本信息</div>
            <div class="form-grid">
                <div class="field">
                    <label>姓名</label>
                    <input type="text" id="fieldName" placeholder="请输入姓名"/>
                </div>
                <div class="field">
                    <label>性别</label>
                    <select id="fieldGender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="field">
                    <label>年龄</label>
                    <input type="number" id="fieldAge" min="1" max="120" placeholder="年龄"/>
                </div>
                <div class="field">
                    <label>联系电话</label>
                    <input type="text" id="fieldPhone" placeholder="手机号码"/>
                </div>
                <div class="field full">
                    <label>紧急联系人</label>
                    <input type="text" id="fieldEmergency" placeholder="姓名 + 电话"/>
                </div>
            </div>
        </div>

        <!-- Medical Info (patient only) -->
        <div class="section-card" id="medSection">
            <div class="section-title">🏥 诊疗信息</div>
            <div class="form-grid">
                <div class="field">
                    <label>主治医生</label>
                    <input type="text" id="fieldDoctor" class="readonly-field" disabled/>
                </div>
                <div class="field">
                    <label>手术日期</label>
                    <input type="date" id="fieldSurgery"/>
                </div>
                <div class="field full">
                    <label>病情备注</label>
                    <textarea id="fieldNotes" placeholder="手术类型、注意事项等…"></textarea>
                </div>
            </div>
        </div>

        <!-- Doctor extra info -->
        <div class="section-card" id="docSection" style="display:none;">
            <div class="section-title">🩺 职业信息</div>
            <div class="form-grid">
                <div class="field">
                    <label>职称</label>
                    <input type="text" id="fieldTitle" placeholder="主任医师"/>
                </div>
                <div class="field">
                    <label>科室</label>
                    <input type="text" id="fieldDept" placeholder="骨科康复科"/>
                </div>
                <div class="field full">
                    <label>医院</label>
                    <input type="text" id="fieldHospital" placeholder="所在医院"/>
                </div>
                <div class="field full">
                    <label>专长</label>
                    <input type="text" id="fieldSpec" placeholder="专业方向"/>
                </div>
                <div class="field full">
                    <label>简介</label>
                    <textarea id="fieldBio" placeholder="个人简介…"></textarea>
                </div>
            </div>
        </div>

        <div class="action-row">
            <a class="back-btn" id="cancelBtn" href="#">取消</a>
            <button class="btn btn-primary" id="saveBtn">保存修改</button>
        </div>
    </div>
</div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script>
if (!requireAuth()) throw new Error('unauth');

const auth = getAuth();
const role = auth.role;
const backPage = role === 'patient' ? 'patient.html' : 'doctor.html';
document.getElementById('backBtn').href = backPage;
document.getElementById('cancelBtn').href = backPage;
document.getElementById('backBrand').href = backPage;

function loadForm() {
    if (role === 'patient') {
        const p = getCurrentPatient();
        document.getElementById('heroAvatar').textContent = p.name.charAt(0);
        document.getElementById('heroName').textContent = p.name;
        document.getElementById('heroRole').textContent = '🧑 使用者';
        document.getElementById('fieldName').value = p.name || '';
        document.getElementById('fieldGender').value = p.gender || '男';
        document.getElementById('fieldAge').value = p.age || '';
        document.getElementById('fieldPhone').value = p.phone || '';
        document.getElementById('fieldEmergency').value = p.emergencyContact || '';
        document.getElementById('fieldDoctor').value = p.doctor || '';
        document.getElementById('fieldSurgery').value = p.surgeryDate || '';
        document.getElementById('fieldNotes').value = p.notes || '';
        document.getElementById('medSection').style.display = '';
        document.getElementById('docSection').style.display = 'none';
    } else {
        const d = getCurrentDoctor();
        document.getElementById('heroAvatar').textContent = d.name.charAt(0);
        document.getElementById('heroName').textContent = d.name;
        document.getElementById('heroRole').textContent = '👨‍⚕️ 主治医师';
        document.getElementById('fieldName').value = d.name || '';
        document.getElementById('fieldGender').value = d.gender || '男';
        document.getElementById('fieldAge').value = d.age || '';
        document.getElementById('fieldPhone').value = d.phone || '';
        document.getElementById('fieldEmergency').value = '';
        document.getElementById('medSection').style.display = 'none';
        document.getElementById('docSection').style.display = '';
        document.getElementById('fieldTitle').value = d.title || '';
        document.getElementById('fieldDept').value = d.department || '';
        document.getElementById('fieldHospital').value = d.hospital || '';
        document.getElementById('fieldSpec').value = d.speciality || '';
        document.getElementById('fieldBio').value = d.bio || '';
    }
}

document.getElementById('saveBtn').onclick = async function() {
    let fields;
    if (role === 'patient') {
        fields = {
            name: document.getElementById('fieldName').value.trim(),
            gender: document.getElementById('fieldGender').value,
            age: parseInt(document.getElementById('fieldAge').value) || undefined,
            phone: document.getElementById('fieldPhone').value.trim(),
            emergencyContact: document.getElementById('fieldEmergency').value.trim(),
            surgeryDate: document.getElementById('fieldSurgery').value,
            notes: document.getElementById('fieldNotes').value.trim(),
        };
    } else {
        fields = {
            name: document.getElementById('fieldName').value.trim(),
            gender: document.getElementById('fieldGender').value,
            phone: document.getElementById('fieldPhone').value.trim(),
            title: document.getElementById('fieldTitle').value.trim(),
            department: document.getElementById('fieldDept').value.trim(),
            hospital: document.getElementById('fieldHospital').value.trim(),
            speciality: document.getElementById('fieldSpec').value.trim(),
            bio: document.getElementById('fieldBio').value.trim(),
        };
    }
    try {
        await saveProfile(role, auth.id, fields);
        loadForm();
        showToast('个人信息已更新', 'success');
    } catch (err) {
        showToast(err.message || '保存失败', 'error');
    }
};

async function init() {
    if (role === 'patient') await bootstrapPatient();
    else await bootstrapDoctor();
    loadForm();
}
init();
</script>
</body>
</html>
