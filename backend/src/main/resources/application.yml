server:
  port: 8080
  tomcat:
    max-connections: 65535
    threads:
      max: 1000
    accept-count: 1600

spring:
  application:
    name: platform
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:your_deepseek_api_key_here}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    url: ${DATABASE_HOST:jdbc:mysql://localhost:3306/renyun}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: 6379
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          min-idle: 0
          max-idle: 4
      database: 1

microservice:
  workerid: 0
  dadacenterid: 0

jwt:
  secret: ${JWT_SECRET:YourSecretKeyForJwtTokenGeneration1234567890}
  expiration: ${JWT_EXPIRATION:86400000}